<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi</title>
    
    <!-- Menambahkan favicon yang sama dengan halaman utama -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b2545'/%3E%3Crect x='18' y='20' width='64' height='28' rx='12' fill='%2338bdf8'/%3E%3Cpath d='M50 38 L58 46 L50 54 L42 46 Z' fill='%23ffffff'/%3E%3Crect x='14' y='52' width='72' height='28' rx='12' fill='%2338bdf8'/%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
        }

        .scanner-header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 16px 12px;
            background-color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid #f1f5f9;
        }

        .back-btn {
            background: none;
            border: none;
            outline: none;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            margin-left: -4px;
            border-radius: 50%;
            transition: opacity 0.2s;
        }
        
        .back-btn:hover {
            opacity: 0.7;
        }

        .scanner-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .notif-section {
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: cardFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notif-item {
            display: flex;
            gap: 12px;
            padding: 12px 10px;
            border-bottom: 1px solid #f1f5f9;
            background-color: transparent;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .notif-item:last-child {
            border-bottom: none;
        }

        .notif-item:hover {
            background-color: #f8fafc;
            border-radius: 12px;
            border-bottom-color: transparent;
        }

        .notif-item.unread {
            background-color: transparent;
        }

        .notif-item.unread::after {
            content: '';
            position: absolute;
            top: 16px;
            right: 12px;
            width: 8px;
            height: 8px;
            background-color: var(--accent-blue);
            border-radius: 50%;
        }

        .notif-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-color: transparent;
            transition: all 0.2s ease;
        }

        .notif-item.unread .notif-icon {
            color: var(--accent-blue);
        }

        .icon-system { color: #64748b; }
        .icon-promo { color: #f59e0b; }
        .icon-success { color: #16a34a; }
        .icon-alert { color: #ef4444; }

        .notif-content {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-right: 12px;
        }

        .notif-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.2;
        }

        .notif-item.unread .notif-title {
            font-weight: 600;
        }

        .notif-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .notif-time {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 400;
            margin-top: 2px;
        }

        .notif-date-group {
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            margin: 16px 0 4px 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="scanner-header">
            <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Kembali">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
            </button>
            <span class="scanner-title">Notifikasi</span>
        </div>

        <div class="notif-section" id="notif-section"></div>
    </div>

    <script>
        const CLINCOO_API = 'https://clincoo-be2.pages.dev/api/wallet-sync';
        let syncKey = '';
        try { syncKey = localStorage.getItem('clincoo_wallet_key') || ''; } catch (e) {}
        let _lastSnap = '';
        let _rendered = [];

        function fmtTime(d) {
            if (!d) return 'Baru saja';
            const dt = new Date(d.replace(' ', 'T') + 'Z');
            const now = new Date();
            const diffMs = now - dt;
            if (diffMs < 60 * 60 * 1000) return Math.max(1, Math.floor(diffMs / 60000)) + ' menit yang lalu';
            if (diffMs < 24 * 60 * 60 * 1000) return Math.floor(diffMs / 3600000) + ' jam yang lalu';
            const sameDay = dt.toDateString() === now.toDateString();
            const yest = new Date(now); yest.setDate(now.getDate() - 1);
            const t = dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            if (sameDay) return 'Hari ini, ' + t;
            if (dt.toDateString() === yest.toDateString()) return 'Kemarin, ' + t;
            return dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + ', ' + t;
        }

        function itemMarkup(n) {
            return '<div class="notif-item' + (n.read ? '' : ' unread') + '" data-id="' + n.id + '" onclick="markAsRead(this)">' +
                '<div class="notif-content">' +
                '<span class="notif-title">' + (n.title || '') + '</span>' +
                '<span class="notif-desc">' + (n.desc || '') + '</span>' +
                '<span class="notif-time">' + (n.time || '') + '</span>' +
                '</div></div>';
        }

        function renderDemo() {
            const section = document.getElementById('notif-section');
            let readSet = [];
            try { readSet = JSON.parse(localStorage.getItem('wallet_notif_read') || '[]'); } catch (e) {}
            _rendered = [
                { id: 'd1', title: 'Cashback 50% Menantimu! 🎉', desc: 'Lakukan transaksi pertamamu hari ini dan dapatkan cashback instan hingga 500.000. S&K berlaku.', time: '2 jam yang lalu' },
                { id: 'd2', title: 'Login Baru Terdeteksi', desc: 'Akunmu baru saja diakses dari perangkat baru di Jakarta. Abaikan jika ini kamu.', time: '5 jam yang lalu' },
                { id: 'd3', title: 'Transfer Berhasil Terselesaikan', desc: 'Pengiriman 1.500.000 ke 0x98f7...a1b2 telah berhasil dikonfirmasi.', time: 'Kemarin, 14:30' },
                { id: 'd4', title: 'Pembaruan Sistem Selesai', desc: 'Sistem telah diperbarui ke versi terbaru. Nikmati transaksi yang lebih cepat dan aman!', time: '2 Hari yang lalu' }
            ].map(function (n) { n.read = readSet.indexOf(n.id) !== -1; return n; });
            section.innerHTML =
                '<div class="notif-date-group">Baru</div>' +
                itemMarkup(_rendered[0]) + itemMarkup(_rendered[1]) +
                '<div class="notif-date-group" style="margin-top: 16px;">Terdahulu</div>' +
                itemMarkup(_rendered[2]) + itemMarkup(_rendered[3]);
        }

        async function pullNotifs() {
            const section = document.getElementById('notif-section');
            try {
                const res = await fetch(CLINCOO_API + '?action=external_pull&api_key=' + encodeURIComponent(syncKey));
                if (!res.ok) { if (!_rendered.length) renderDemo(); return; }
                const d = await res.json();
                const notifs = (d.data && d.data.notifications) || [];
                const snap = JSON.stringify(notifs.map(function (n) { return n.id + ':' + n.read + ':' + n.created_at; }));
                if (snap === _lastSnap) return;
                _lastSnap = snap;
                _rendered = notifs.map(function (n) {
                    return { id: n.id, title: n.source || 'Notifikasi', desc: n.message || '', time: fmtTime(n.created_at), read: n.read, _nid: n.id };
                });
                if (_rendered.length === 0) {
                    section.innerHTML = '<div class="notif-date-group">Baru</div><div class="notif-item"><div class="notif-content"><span class="notif-title">Belum ada notifikasi</span><span class="notif-desc">Notifikasi Clincoo akan muncul di sini secara real-time.</span><span class="notif-time">Baru saja</span></div></div>';
                    return;
                }
                const today = _rendered.filter(function (n) { return !n.read || n.time.indexOf('yang lalu') !== -1 || n.time.indexOf('Hari ini') !== -1; });
                const older = _rendered.filter(function (n) { return today.indexOf(n) === -1; });
                let html = '';
                if (today.length) { html += '<div class="notif-date-group">Baru</div>' + today.map(itemMarkup).join(''); }
                if (older.length) { html += '<div class="notif-date-group" style="margin-top: 16px;">Terdahulu</div>' + older.map(itemMarkup).join(''); }
                section.innerHTML = html;
            } catch (e) { if (!_rendered.length) renderDemo(); }
        }

        function markAsRead(element) {
            if (element.classList.contains('unread')) {
                element.classList.remove('unread');
                element.style.transform = 'scale(0.98)';
                setTimeout(() => { element.style.transform = 'scale(1)'; }, 150);
                const nid = element.getAttribute('data-id');
                if (syncKey && nid && nid.indexOf('d') !== 0) {
                    fetch(CLINCOO_API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'external_read', api_key: syncKey, id: parseInt(nid, 10) }) }).catch(function () {});
                } else if (nid) {
                    let readSet = [];
                    try { readSet = JSON.parse(localStorage.getItem('wallet_notif_read') || '[]'); } catch (e) {}
                    if (readSet.indexOf(nid) === -1) { readSet.push(nid); try { localStorage.setItem('wallet_notif_read', JSON.stringify(readSet)); } catch (e) {} }
                }
            }
        }

        if (syncKey) {
            pullNotifs();
            setInterval(function () { if (!document.hidden) pullNotifs(); }, 5000);
            document.addEventListener('visibilitychange', function () { if (!document.hidden) pullNotifs(); });
        } else {
            renderDemo();
        }
    </script>
</body>
</html>
